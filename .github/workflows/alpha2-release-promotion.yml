name: Publish verified alpha 2 release
on:
  push:
    branches: [ci/alpha2-release-promotion]
    paths: [.github/workflows/alpha2-release-promotion.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the complete reviewed alpha 2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.1-alpha.2 --repo vdjango/buggcraft --draft=false --prerelease
