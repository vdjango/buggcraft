name: Cancel superseded launcher package run
on:
  push:
    branches: [ci/alpha2-release-promotion]
    paths: [.github/workflows/alpha2-release-promotion.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older main package run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/vdjango/buggcraft/actions/runs/41062075588/cancel
