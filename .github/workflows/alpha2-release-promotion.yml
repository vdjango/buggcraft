name: Retry alpha 2 download-site sync
on:
  push:
    branches: [ci/alpha2-release-promotion]
    paths: [.github/workflows/alpha2-release-promotion.yml]
permissions:
  actions: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed publication job with existing build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/vdjango/buggcraft/actions/runs/41057658766/rerun-failed-jobs
