name: Package launcher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/**'
      - 'build*'
      - 'requirements*.txt'
      - 'scripts/stage_release.py'
      - 'scripts/build_bridge.py'
      - 'tests/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            arch: x64
          - os: macos-15-intel
            platform: macos-x86_64
            arch: x64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned native multiplayer implementation
        uses: actions/checkout@v4
        with:
          repository: vdjango/minecraft-tunnel-native
          ref: 415adda8b781f44dc18d93f04a7270e4412b8d07
          path: native-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Test release file validation
        run: python -m unittest tests.test_release_staging -v
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip check
      - name: Prepare Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Prepare macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build and test native multiplayer runtime
        run: |
          python scripts/build_bridge.py --native-source native-source --output dist/native-runtime
          ctest --test-dir native-source/build --build-config Release --output-on-failure
      - name: Test resource catalogues and gateway
        run: |
          python -m pip install -r packaging/content-gateway-requirements.txt
          python -m pip install asyncssh==2.23.0
          python -m unittest tests.test_curseforge tests.test_content_download tests.test_content_dialog tests.test_modpack_import tests.test_content_gateway -v
      - name: Check slim transport and rendering configuration
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8')
          modules = ['test_native_library', 'test_native_routes', 'test_native_cutover',
                     'test_native_bridge_staging', 'test_visibility',
                     'test_slim_packaging', 'test_system_fonts', 'test_qt_runtime',
                     'test_macos_packaging', 'test_portable_game_directory',
                     'test_connection_diagnostics', 'test_modpack_no_key',
                     'test_inherited_launch', 'test_game_sessions', 'test_game_diagnostics',
                     'test_startup_logging', 'test_startup_resource_paths', 'test_launcher_process',
                     'test_java_runtime_selection', 'test_launcher_qml', 'test_installation_qml',
                     'test_navigation_polish', 'test_task_history_qml']
          result = subprocess.run([sys.executable, '-u', '-m', 'unittest',
                                   *['tests.' + name for name in modules], '-v'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  text=True, encoding='utf-8', errors='replace',
                                  env=dict(os.environ, PYTHONIOENCODING='utf-8'))
          pathlib.Path('dist').mkdir(exist_ok=True)
          pathlib.Path('dist/preflight.log').write_text(result.stdout, encoding='utf-8')
          print(result.stdout)
          if result.returncode:
              tail = result.stdout[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Launcher preflight failed::' + tail)
          raise SystemExit(result.returncode)
          PY
      - name: Prepare macOS application icon
        if: runner.os == 'macOS'
        run: |
          iconset="dist/Buggcraft.iconset"
          mkdir -p "$iconset"
          for entry in '16 16' '16 32' '32 32' '32 64' '128 128' '128 256' '256 256' '256 512' '512 512' '512 1024'; do
            read -r size pixels <<< "$entry"
            suffix=''
            [[ "$pixels" == $((size * 2)) ]] && suffix='@2x'
            sips -z "$pixels" "$pixels" resources/icons/1024x1024/app.png --out "$iconset/icon_${size}x${size}${suffix}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o resources/icons/app.icns
      - name: Build native package
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_REPOSITORY: ${{ github.repository }}
        run: |
          python -u - <<'PY'
          import collections, os, pathlib, subprocess, sys, urllib.parse
          output = pathlib.Path('dist')
          output.mkdir(exist_ok=True)
          tail = collections.deque(maxlen=35)
          with (output / 'build.log').open('w', encoding='utf-8') as log:
              command = [sys.executable, 'build.py', '--jobs', '3',
                         '--native-bridge-dir', 'dist/native-runtime']
              if os.name == 'nt' and os.environ['BUILD_REF_TYPE'] == 'tag':
                  tag = urllib.parse.quote(os.environ['BUILD_REF_NAME'], safe='')
                  repository = os.environ['BUILD_REPOSITORY']
                  command += ['--runtime-url', f'https://github.com/{repository}/releases/download/{tag}/Buggcraft-runtime-windows-x64.zip']
              process = subprocess.Popen(command,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
                  tail.append(line.rstrip())
              status = process.wait()
          if status:
              message = '\n'.join(line[-700:] for line in tail)[-3500:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Native package build failed::' + message)
          raise SystemExit(status)
          PY
      - name: Check bundled runtime in isolation
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python - <<'PY'
          import os, pathlib, plistlib, subprocess
          root = pathlib.Path.cwd()
          output = root / 'dist'
          if os.name == 'nt':
              executable = output / 'main.dist/Buggcraft.exe'
          else:
              bundle, = output.glob('*.app')
              info = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())
              executable = bundle / 'Contents/MacOS' / info['CFBundleExecutable']
          env = dict(os.environ)
          for key in ('PYTHONPATH', 'PYTHONHOME', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML2_IMPORT_PATH'):
              env.pop(key, None)
          env['BUGGCRAFT_LOG_DIR'] = str(output)
          env['PATH'] = os.environ['WINDIR'] + '/System32' if os.name == 'nt' else '/usr/bin:/bin'
          subprocess.run([str(executable), '--package-check', str(output / 'package-check.json')],
                         cwd=output, env=env, check=True, timeout=120)
          PY
      - name: Prepare validated downloads
        run: python scripts/stage_release.py --platform "${{ matrix.platform }}"
      - name: Upload application downloads
        uses: actions/upload-artifact@v4
        with:
          name: Buggcraft-${{ matrix.platform }}-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: dist/release/*
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/signing-status.json
            dist/qt-trim-report.json
            dist/package-check.*
            dist/build.log
            dist/preflight.log
      - name: Link downloads in the run summary
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### {os.environ['BUILD_PLATFORM']}\n\n")
              summary.write(f"Download the **Buggcraft-** artifact from [this run]({os.environ['RUN_URL']}).\n\n")
              summary.write('Windows branch builds: extract the artifact and keep the installer beside the runtime ZIP for offline installation.\n')
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Buggcraft-*
          path: release-files
          merge-multiple: true
      - name: Include corresponding source and license
        run: |
          git archive --format=tar.gz -o release-files/Buggcraft-source.tar.gz HEAD
          cp LICENSE release-files/LICENSE
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 下载

          - Windows x64：`Buggcraft-Setup.exe`；首次运行会下载同一版本的完整运行包。
          - 离线安装：下载 `Buggcraft-runtime-windows-x64.zip`，与安装程序放在同一目录，无需解压 ZIP。
          - macOS：按芯片选择 `arm64`（Apple Silicon）或 `x86_64`（Intel），解压后运行应用。
          - `SHA256SUMS-*.txt` 用于核对文件完整性；构建日志留在 Actions，不放入发布下载。

          Windows 构建目前没有受信任的代码签名，macOS 构建使用 ad-hoc 签名且未经 Apple 公证。系统可能阻止运行；不要关闭系统防护。发布者应先完成对应系统的安装验收与签名审查，再公开此草稿。
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Buggcraft $RELEASE_TAG" --notes-file release-notes.md release-files/*
