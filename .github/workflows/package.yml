name: Build and release native launcher
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: ${{ vars.BUGG_RELEASE_RUNNER || 'windows-2022' }}
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    env:
      BUGG_CI_QT_ROOT: ${{ vars.BUGG_RELEASE_QT_ROOT || 'D:/bugg-qt/static' }}
      BUGG_CI_QT_SOURCE: ${{ vars.BUGG_RELEASE_QT_SOURCE || 'D:/bugg-qt/src' }}
      BUGG_CI_OPENSSL_ROOT: ${{ vars.BUGG_RELEASE_OPENSSL_ROOT }}
      BUGG_CI_LINGUIST_ROOT: ${{ vars.BUGG_RELEASE_LINGUIST_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bugg
      - uses: actions/checkout@v4
        with:
          repository: vdjango/minecraft-tunnel-native
          ref: f4480e00b6168cbdd8eef49040201e8cc734f25f
          path: minecraft-tunnel-native
      - uses: actions/setup-python@v5
        if: vars.BUGG_RELEASE_QT_ROOT == ''
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Read application version
        id: version
        shell: powershell
        run: |
          $match = [regex]::Match((Get-Content bugg/CMakeLists.txt -Raw), 'set\(BUGG_BUILD_VERSION "([^"]+)"')
          if (!$match.Success) { throw 'Missing application version' }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application versions differ' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Restore static Qt kit
        if: vars.BUGG_RELEASE_QT_ROOT == ''
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            D:/bugg-qt/static
            D:/bugg-qt/src
          key: qt-6.8.1-static-mt-windows2022-${{ hashFiles('bugg/tools/build_size_qt.cmake', 'bugg/tools/patch_qtmultimedia_windows_vulkan.cmake') }}
      - name: Build pinned static Qt and translation tools
        if: vars.BUGG_RELEASE_QT_ROOT == '' && steps.qt-cache.outputs.cache-hit != 'true'
        run: cmake -DWORK_ROOT=D:/bugg-qt -DSTATIC_RUNTIME=ON -DPARALLEL=4 -P bugg/tools/build_size_qt.cmake
      - name: Save completed Qt kit before application build
        if: vars.BUGG_RELEASE_QT_ROOT == '' && steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            D:/bugg-qt/static
            D:/bugg-qt/src
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Install static OpenSSL
        if: vars.BUGG_RELEASE_OPENSSL_ROOT == ''
        run: vcpkg install openssl:x64-windows-static
      - name: Restore prepared native source archives
        if: vars.BUGG_RELEASE_NATIVE_DEPS != ''
        run: Copy-Item -LiteralPath '${{ vars.BUGG_RELEASE_NATIVE_DEPS }}' -Destination minecraft-tunnel-native/.deps -Recurse
      - name: Fetch pinned native dependencies
        run: python minecraft-tunnel-native/scripts/fetch_deps.py
      - name: Build native single executable
        shell: powershell
        run: |
          $openssl = if ($env:BUGG_CI_OPENSSL_ROOT) { $env:BUGG_CI_OPENSSL_ROOT } else { "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static" }
          $options = @("-DQT_ROOT=$env:BUGG_CI_QT_ROOT", "-DQT_SOURCE_ROOT=$env:BUGG_CI_QT_SOURCE", "-DOPENSSL_ROOT=$openssl")
          if ($env:BUGG_CI_LINGUIST_ROOT) { $options += "-DQt6LinguistTools_DIR=$env:BUGG_CI_LINGUIST_ROOT" }
          cmake @options -DWORK_ROOT=D:/bugg-build -DOUTPUT_ROOT=D:/bugg-package -DPARALLEL=4 "-DBUGG_BUILD_VERSION=${{ steps.version.outputs.value }}" "-DBUGG_LANGUAGE_ASSET_VERSION=${{ steps.version.outputs.value }}" -P bugg/tools/build_single_file.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      - name: Verify version and bridge entry
        shell: powershell
        run: |
          if ((Get-Item D:/bugg-package/bugg.exe).VersionInfo.FileVersion -ne '${{ steps.version.outputs.value }}') { throw 'Wrong executable version' }
          $bridge = Start-Process -FilePath 'D:/bugg-package/bugg.exe' -ArgumentList @('--native-bridge', '--version') -WindowStyle Hidden -Wait -PassThru
          if ($bridge.ExitCode -ne 0) { throw 'Bridge entry failed' }
      - name: Package update and language assets
        run: python bugg/tools/package_release.py --version '${{ steps.version.outputs.value }}' --executable D:/bugg-package/bugg.exe --languages D:/bugg-build/launcher/language-assets --output D:/bugg-release --migration-entry Bugg-v1.1.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Bugg-v${{ steps.version.outputs.value }}-windows-x64
          path: D:/bugg-release/*
          if-no-files-found: error
  desktop:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: [windows, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: bugg
      - name: Read application version
        id: version
        shell: powershell
        run: |
          $match = [regex]::Match((Get-Content bugg/CMakeLists.txt -Raw), 'set\(BUGG_BUILD_VERSION "([^"]+)"')
          "value=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          pattern: Bugg-v${{ steps.version.outputs.value }}-*
          merge-multiple: true
          path: D:/bugg-release
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: vdjango/buggcraft
        shell: powershell
        run: |
          $headers = @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          # Ship the matching node first. The launcher artifact remains staged
          # while the node's independent platform jobs finish publishing.
          $nodeDeadline = (Get-Date).AddMinutes(30)
          $nodeReady = $false
          do {
            try {
              $node = Invoke-RestMethod -Uri 'https://api.github.com/repos/vdjango/minecraft-tunnel-native/releases/tags/v0.3.12' -Headers $headers
              $nodeReady = !$node.draft -and @($node.assets | Where-Object { $_.name -eq 'buggcraft-native-0.3.12-linux-x64.tar.gz' }).Count -eq 1
            } catch { $nodeReady = $false }
            if (!$nodeReady) { Start-Sleep -Seconds 20 }
          } while (!$nodeReady -and (Get-Date) -lt $nodeDeadline)
          if (!$nodeReady) { throw 'Matching node release v0.3.12 is not published; launcher remains staged' }
          $notes = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'bugg/.github/release-notes-v${{ steps.version.outputs.value }}.md'), [System.Text.Encoding]::UTF8)
          $body = @{tag_name=$env:GITHUB_REF_NAME;name='Bugg v${{ steps.version.outputs.value }}';body=$notes;draft=$true;prerelease=$false} | ConvertTo-Json
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$env:GITHUB_REF_NAME" -Headers $headers
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          # The tag endpoint can hide drafts; list drafts before creating one.
          if (!$release) {
            $page = 1
            do {
              $releases = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases?per_page=100&page=$page" -Headers $headers)
              $release = $releases | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } | Select-Object -First 1
              $page++
            } while (!$release -and $releases.Count -eq 100)
          }
          if ($release) {
            if (!$release.draft) { throw 'This tag already has a published release' }
            $release = Invoke-RestMethod -Method Patch -Uri $release.url -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($body))
          } else {
            $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GH_REPO/releases" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($body))
          }
          $upload = $release.upload_url -replace '\{.*$', ''
          Get-ChildItem D:/bugg-release -File | ForEach-Object {
            $file = $_
            $existing = @($release.assets | Where-Object { $_.name -eq $file.Name })
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if (!$existing.Count -or $existing[0].digest -ne $digest) {
              if ($existing.Count) { Invoke-RestMethod -Method Delete -Uri $existing[0].url -Headers $headers | Out-Null }
              Invoke-RestMethod -Method Post -Uri ($upload + '?name=' + [uri]::EscapeDataString($file.Name)) -Headers $headers -ContentType 'application/octet-stream' -InFile $file.FullName | Out-Null
            }
          }
          Invoke-RestMethod -Method Patch -Uri $release.url -Headers $headers -ContentType 'application/json' -Body '{"draft":false}' | Out-Null
      - name: Notify download website with Actions identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $audience = [uri]::EscapeDataString('https://download.bugg.icu/api/launcher/github-sync')
          $identity = Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $payload = @{tag=$env:GITHUB_REF_NAME;github_token=$env:GH_TOKEN} | ConvertTo-Json -Compress
          $result = Invoke-RestMethod -Method Post -Uri 'https://download.bugg.icu/api/launcher/github-sync' -Headers @{Authorization="Bearer $($identity.value)"} -ContentType 'application/json' -Body $payload
          $statusPayload = @{tag=$env:GITHUB_REF_NAME;action='status'} | ConvertTo-Json -Compress
          $deadline = (Get-Date).AddMinutes(20)
          do {
            Start-Sleep -Seconds 5
            $result = Invoke-RestMethod -Method Post -Uri 'https://download.bugg.icu/api/launcher/github-sync' -Headers @{Authorization="Bearer $($identity.value)"} -ContentType 'application/json' -Body $statusPayload
            if ($result.sync.status -eq 'failed') { throw $result.sync.message }
            $imported = @($result.sync.items | Where-Object { $_.tag -eq $env:GITHUB_REF_NAME -and $_.result -in @('imported','existing') }).Count -gt 0
            if ($result.sync.status -eq 'success' -and $imported) { break }
          } while ((Get-Date) -lt $deadline)
          if (!$imported -or $result.sync.status -ne 'success') { throw 'Download website import did not finish' }
          Write-Output ('Download website sync: ' + $result.sync.status)
