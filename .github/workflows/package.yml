name: Package launcher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/**'
      - 'build*'
      - 'requirements*.txt'
      - 'scripts/stage_release.py'
      - 'scripts/build_bridge.py'
      - 'tests/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            arch: x64
          - os: ubuntu-24.04
            platform: linux-x86_64
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
          - os: macos-15-intel
            platform: macos-x86_64
            arch: x64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Embed the launcher release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA:0:12}"
          fi
          python - "$version" <<'PY'
          import re, sys
          value = sys.argv[1]
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', value):
              raise SystemExit('Tag must contain a semantic launcher version')
          open('resources/app-version.txt', 'w', encoding='ascii').write(value + '\n')
          PY
      - name: Check out pinned native multiplayer implementation
        uses: actions/checkout@v4
        with:
          repository: vdjango/minecraft-tunnel-native
          ref: 61faab57db2d424493d41c1ec21a3909527dee26
          path: native-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Test release file validation
        run: python -m unittest tests.test_release_staging tests.test_release_platform_sync -v
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip check
      - name: Prepare Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows 'curl[openssl]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Prepare macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Prepare Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev patchelf libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Build and test native multiplayer runtime
        run: |
          python scripts/build_bridge.py --native-source native-source --output dist/native-runtime --log dist/native-build.log
          ctest --test-dir native-source/build --build-config Release --output-on-failure
      - name: Test resource catalogues and gateway
        run: |
          python -m pip install -r packaging/content-gateway-requirements.txt
          python -m pip install asyncssh==2.23.0
          python -m unittest tests.test_curseforge tests.test_content_download tests.test_content_dialog tests.test_modpack_import tests.test_content_gateway -v
      - name: Check slim transport and rendering configuration
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8')
          modules = ['test_native_library', 'test_native_routes', 'test_native_cutover',
                     'test_native_bridge_staging', 'test_visibility',
                     'test_slim_packaging', 'test_system_fonts', 'test_qt_runtime',
                     'test_macos_packaging', 'test_portable_game_directory',
                     'test_connection_diagnostics', 'test_modpack_no_key',
                     'test_inherited_launch', 'test_game_sessions', 'test_game_diagnostics',
                     'test_startup_logging', 'test_startup_resource_paths', 'test_launcher_process',
                     'test_update_client', 'test_launcher_updates', 'test_resource_translation', 'test_ui_refinements',
                     'test_loader_catalogue', 'test_native_code_import',
                     'test_java_runtime_selection', 'test_java_downloads', 'test_launcher_qml', 'test_installation_qml',
                     'test_navigation_polish', 'test_task_history_qml', 'test_payload_cache',
                     'test_unix_qt_trimming', 'test_room_mod_installation',
                     'test_room_launch_flow', 'test_lobby_layout',
                     'test_instance_deletion', 'test_instance_modpack_entry',
                     'test_download_transport', 'test_modrinth_import']
          result = subprocess.run([sys.executable, '-u', '-m', 'unittest',
                                   *['tests.' + name for name in modules], '-v'],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                  text=True, encoding='utf-8', errors='replace',
                                  env=dict(os.environ, PYTHONIOENCODING='utf-8'))
          pathlib.Path('dist').mkdir(exist_ok=True)
          pathlib.Path('dist/preflight.log').write_text(result.stdout, encoding='utf-8')
          print(result.stdout)
          if result.returncode:
              tail = result.stdout[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Launcher preflight failed::' + tail)
          raise SystemExit(result.returncode)
          PY
      - name: Prepare macOS application icon
        if: runner.os == 'macOS'
        run: |
          iconset="dist/Buggcraft.iconset"
          mkdir -p "$iconset"
          for entry in '16 16' '16 32' '32 32' '32 64' '128 128' '128 256' '256 256' '256 512' '512 512' '512 1024'; do
            read -r size pixels <<< "$entry"
            suffix=''
            [[ "$pixels" == $((size * 2)) ]] && suffix='@2x'
            sips -z "$pixels" "$pixels" resources/icons/1024x1024/app.png --out "$iconset/icon_${size}x${size}${suffix}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o resources/icons/app.icns
      - name: Build native package
        run: |
          python -u - <<'PY'
          import collections, os, pathlib, subprocess, sys
          output = pathlib.Path('dist')
          output.mkdir(exist_ok=True)
          tail = collections.deque(maxlen=35)
          with (output / 'build.log').open('w', encoding='utf-8') as log:
              command = [sys.executable, 'build.py', '--jobs', '3',
                         '--native-bridge-dir', 'dist/native-runtime']
              if os.name == 'nt' or sys.platform.startswith('linux'):
                  command.append('--onefile')
              process = subprocess.Popen(command,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
                  tail.append(line.rstrip())
              status = process.wait()
          if status:
              message = '\n'.join(line[-700:] for line in tail)[-3500:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Native package build failed::' + message)
          raise SystemExit(status)
          PY
      - name: Check bundled runtime in isolation
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python - <<'PY'
          import os, pathlib, plistlib, subprocess, sys
          root = pathlib.Path.cwd()
          output = root / 'dist'
          if os.name == 'nt' or sys.platform.startswith('linux'):
              executable = output / ('Buggcraft.exe' if os.name == 'nt' else 'Buggcraft')
          else:
              bundle, = output.glob('*.app')
              info = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())
              executable = bundle / 'Contents/MacOS' / info['CFBundleExecutable']
          env = dict(os.environ)
          for key in ('PYTHONPATH', 'PYTHONHOME', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML2_IMPORT_PATH'):
              env.pop(key, None)
          env['BUGGCRAFT_LOG_DIR'] = str(output)
          env['PATH'] = os.environ['WINDIR'] + '/System32' if os.name == 'nt' else '/usr/bin:/bin'
          subprocess.run([str(executable), '--package-check', str(output / 'package-check.json')],
                         cwd=output, env=env, check=True, timeout=120)
          PY
      - name: Prepare validated downloads
        run: python scripts/stage_release.py --platform "${{ matrix.platform }}"
      - name: Upload application downloads
        uses: actions/upload-artifact@v4
        with:
          name: Buggcraft-${{ matrix.platform }}-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: dist/release/*
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/signing-status.json
            dist/qt-trim-report.json
            dist/package-check.*
            dist/build.log
            dist/preflight.log
            dist/native-build.log
            native-source/build/Testing/Temporary/LastTest.log
      - name: Link downloads in the run summary
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### {os.environ['BUILD_PLATFORM']}\n\n")
              summary.write(f"Download the **Buggcraft-** artifact from [this run]({os.environ['RUN_URL']}).\n\n")
              summary.write('Windows and Linux downloads contain one self-contained executable. macOS downloads contain one ZIP with the native application bundle.\n')
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test platform synchronization client
        run: python -m unittest discover -s tests -p test_release_platform_sync.py -v
      - uses: actions/download-artifact@v4
        with:
          pattern: Buggcraft-*
          path: release-files
          merge-multiple: true
      - name: Include corresponding source and license
        run: |
          git archive --format=tar.gz -o release-files/Buggcraft-source.tar.gz HEAD
          cp LICENSE release-files/LICENSE
          printf '%s\n' "${GITHUB_REF_NAME#v}" > release-files/BUGGCRAFT_VERSION.txt
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 下载

          - Windows x64：下载并运行 `Buggcraft.exe`。
          - Linux x86_64：下载 `Buggcraft` 并赋予可执行权限后运行；构建目标为 Ubuntu 24.04。
          - Linux ARM64：下载 `Buggcraft-linux-arm64` 并赋予可执行权限后运行；构建目标为 Ubuntu 24.04 ARM64。
          - macOS：按芯片选择 `arm64`（Apple Silicon）或 `x86_64`（Intel），解压后运行应用。
          - `SHA256SUMS-*.txt` 用于核对文件完整性；构建日志留在 Actions，不放入发布下载。

          Windows 构建目前没有受信任的代码签名，macOS 构建使用 ad-hoc 签名且未经 Apple 公证。发布者应先完成对应系统的安装验收与签名审查，再公开此草稿。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release retained; retrying platform synchronization."
          else
            prerelease=()
            [[ "${RELEASE_TAG#v}" == *-* ]] && prerelease=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" --title "Buggcraft $RELEASE_TAG" --notes-file release-notes.md release-files/*
          fi
      - name: Synchronize build assets to platform cache
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/sync_platform_release.py
