name: Package launcher

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/**'
      - 'build*'
      - 'requirements*.txt'
      - 'scripts/stage_release.py'
      - 'scripts/build_bridge.py'
      - 'scripts/require_main_build.py'
      - 'scripts/release_launcher_tag.py'
      - 'scripts/check_ci_contract.py'
      - 'tests/**'
      - 'docs/guides/启动器发布检查清单.md'
      - '.github/workflows/package.yml'
      - '.github/workflows/client-regression.yml'
      - '.github/workflows/release-launcher.yml'
  push:
    branches: [main, 'release/**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/**'
      - 'build*'
      - 'requirements*.txt'
      - 'scripts/stage_release.py'
      - 'scripts/build_bridge.py'
      - 'scripts/require_main_build.py'
      - 'scripts/release_launcher_tag.py'
      - 'scripts/check_ci_contract.py'
      - 'tests/**'
      - 'docs/guides/启动器发布检查清单.md'
      - '.github/workflows/package.yml'
      - '.github/workflows/client-regression.yml'
      - '.github/workflows/release-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Avoid hosted-runner HTTP/2 stream resets while checking out either repo.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

concurrency:
  # A stuck runner for an older commit must not block a validated replacement.
  group: package-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Check CI contracts before platform builds
        run: python scripts/check_ci_contract.py
      - name: Require main validation before building a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/require_main_build.py

      - uses: actions/setup-python@v5
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-test.txt
      - name: Install launcher test dependencies
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-test.txt
          python -m pip check
      - name: Test release file validation
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: python -m unittest tests.test_release_staging tests.test_release_platform_sync -v
      - name: Check slim transport and rendering configuration
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8')
          modules = ['test_native_library', 'test_native_routes', 'test_native_cutover',
                     'test_native_bridge_staging', 'test_visibility',
                     'test_native_transport_poll',
                     'test_slim_packaging', 'test_system_fonts', 'test_qt_runtime',
                     'test_macos_packaging', 'test_portable_game_directory',
                     'test_connection_diagnostics', 'test_feedback_upload', 'test_nat_probe', 'test_p2p_evidence', 'test_modpack_no_key',
                     'test_inherited_launch', 'test_game_sessions', 'test_game_diagnostics',
                     'test_startup_logging', 'test_startup_resource_paths', 'test_launcher_process',
                     'test_update_client', 'test_launcher_updates', 'test_resource_translation', 'test_ui_refinements',
                     'test_loader_catalogue', 'test_loader_catalogue_regressions',
                     'test_download_error_presentation', 'test_modpack_missing_mods', 'test_native_code_import',
                     'test_java_runtime_selection', 'test_java_downloads', 'test_launcher_qml', 'test_installation_qml',
                     'test_navigation_polish', 'test_task_history_qml', 'test_payload_cache', 'test_portable_storage',
                     'test_unix_qt_trimming', 'test_room_mod_installation',
                     'test_room_launch_flow', 'test_lobby_layout', 'test_room_lobby_ui',
                     'test_game_log_ui',
                     'test_chat_controller', 'test_clipboard', 'test_friend_directory', 'test_social_diagnostics',
                     'test_friend_entry_regression', 'test_friend_entry_ui', 'test_lobby_opening', 'test_lobby_navigation',
                     'test_instance_deletion', 'test_instance_modpack_entry',
                     'test_download_transport', 'test_download_locks', 'test_installation_receipt', 'test_modrinth_import',
                     'test_release_gate', 'test_regression_wiring']
          pathlib.Path('dist').mkdir(exist_ok=True)
          # Give each module a fresh Qt/runtime lifetime. Collecting dead UI
          # objects in a later HTTP worker can otherwise crash the interpreter.
          failed = []
          with pathlib.Path('dist/preflight.log').open('w', encoding='utf-8') as log:
              for name in modules:
                  result = subprocess.run([sys.executable, '-X', 'faulthandler', '-u',
                                           '-m', 'unittest', 'tests.' + name, '-v'],
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                          text=True, encoding='utf-8', errors='replace',
                                          env=dict(os.environ, PYTHONIOENCODING='utf-8'))
                  heading = f'=== {name} (exit {result.returncode}) ===\n'
                  log.write(heading + result.stdout)
                  log.flush()
                  print(heading + result.stdout, flush=True)
                  if result.returncode:
                      failed.append(name)
                      tail = result.stdout[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Launcher preflight failed: ' + name + '::' + tail)
          if failed:
              print('Failed modules: ' + ', '.join(failed))
          raise SystemExit(1 if failed else 0)
          PY
      - name: Keep preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-preflight-${{ github.sha }}
          path: dist/preflight.log
          if-no-files-found: ignore

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            native_asset: buggcraft-native-0.3.5-windows-x64.zip
            arch: x64
            python: '3.11'
          - os: ubuntu-24.04
            platform: linux-x86_64
            native_asset: buggcraft-native-0.3.5-linux-x64.tar.gz
            arch: x64
            python: '3.11'
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            native_asset: ''
            arch: arm64
            python: '3.12'
          - os: macos-15-intel
            platform: macos-x86_64
            native_asset: buggcraft-native-0.3.5-macos-x64.tar.gz
            arch: x64
            python: '3.11'
          - os: macos-15
            platform: macos-arm64
            native_asset: buggcraft-native-0.3.5-macos-arm64.tar.gz
            arch: arm64
            python: '3.11'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    # Preflight passed in validate; reuse the pinned native runtime when cached.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Embed the launcher release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA:0:12}"
          fi
          python - "$version" <<'PY'
          import re, sys
          value = sys.argv[1]
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', value):
              raise SystemExit('Tag must contain a semantic launcher version')
          open('resources/app-version.txt', 'w', encoding='ascii').write(value + '\n')
          PY
      - name: Restore pinned native multiplayer runtime
        id: native-cache
        uses: actions/cache@v4
        with:
          path: dist/native-runtime
          key: native-runtime-v2-${{ matrix.platform }}-f5f0e4433ed8b935c071ab8ae1f8926939b52e83
      - name: Download tested native release assets
        id: native_download
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.native_asset != ''
        continue-on-error: true
        env:
          NATIVE_ASSET: ${{ matrix.native_asset }}
        run: |
          set -euo pipefail
          mkdir -p dist/native-archive dist/native-runtime
          base=https://github.com/vdjango/minecraft-tunnel-native/releases/download/v0.3.5
          curl -fL --retry 3 --retry-all-errors "$base/$NATIVE_ASSET" -o "dist/native-archive/$NATIVE_ASSET"
          curl -fL --retry 3 --retry-all-errors "$base/$NATIVE_ASSET.sha256" -o "dist/native-archive/$NATIVE_ASSET.sha256"
          python - "$NATIVE_ASSET" <<'PY'
          import hashlib, pathlib, sys
          directory = pathlib.Path('dist/native-archive')
          name = sys.argv[1]
          expected = (directory / (name + '.sha256')).read_text(encoding='ascii').split()[0]
          with (directory / name).open('rb') as source:
              actual = hashlib.file_digest(source, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('Native release checksum mismatch: ' + name)
          PY
          if [[ "$NATIVE_ASSET" == *.zip ]]; then
            python -m zipfile -e "dist/native-archive/$NATIVE_ASSET" dist/native-unpacked
            mv dist/native-unpacked/runtime/* dist/native-runtime/
          else
            tar -xzf "dist/native-archive/$NATIVE_ASSET" -C dist/native-runtime --strip-components=1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('dist/native-runtime/share/buggcraft-native/build-info.json').read_text())
          if metadata.get('commit') != 'f5f0e4433ed8b935c071ab8ae1f8926939b52e83':
              raise SystemExit('Downloaded native runtime does not match the pinned source revision')
          PY
      - name: Check out pinned native multiplayer implementation
        if: steps.native-cache.outputs.cache-hit != 'true' && (matrix.native_asset == '' || steps.native_download.outcome == 'failure')
        uses: actions/checkout@v4
        with:
          repository: vdjango/minecraft-tunnel-native
          ref: f5f0e4433ed8b935c071ab8ae1f8926939b52e83
          path: native-source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-test.txt
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip check
      - name: Prepare Windows native dependencies
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true' && (matrix.native_asset == '' || steps.native_download.outcome == 'failure')
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows 'curl[openssl]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Prepare macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Prepare Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Prepare Linux native compiler dependencies
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true' && (matrix.native_asset == '' || steps.native_download.outcome == 'failure')
        run: sudo apt-get install -y build-essential cmake libssl-dev libcurl4-openssl-dev
      - name: Build and test native multiplayer runtime
        if: steps.native-cache.outputs.cache-hit != 'true' && (matrix.native_asset == '' || steps.native_download.outcome == 'failure')
        run: |
          rm -rf dist/native-runtime
          python scripts/build_bridge.py --native-source native-source --output dist/native-runtime --log dist/native-build.log
          ctest --test-dir native-source/build --build-config Release --output-on-failure
      - name: Test launcher against installed C++ bridge DLL and executable
        run: |
          python -m pip install -r requirements-test.txt
          python - <<'PY'
          import os, pathlib, subprocess, sys
          package = pathlib.Path('dist/native-runtime').resolve()
          library = 'buggcraft_bridge.dll' if os.name == 'nt' else (
              'libbuggcraft_bridge.dylib' if sys.platform == 'darwin' else 'libbuggcraft_bridge.so')
          environment = dict(os.environ,
              BUGGCRAFT_BRIDGE_LIBRARY=str(package / ('bin' if os.name == 'nt' else 'lib') / library),
              BUGGCRAFT_BRIDGE_EXECUTABLE=str(package / 'bin' / ('buggcraft-bridge.exe' if os.name == 'nt' else 'buggcraft-bridge')))
          environment['PATH'] = str(package / 'bin') + os.pathsep + environment['PATH']
          subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests/test_native_bridge_runtime.py'],
                         env=environment, check=True)
          PY
      - name: Prepare macOS application icon
        if: runner.os == 'macOS'
        run: |
          iconset="dist/Buggcraft.iconset"
          mkdir -p "$iconset"
          for entry in '16 16' '16 32' '32 32' '32 64' '128 128' '128 256' '256 256' '256 512' '512 512' '512 1024'; do
            read -r size pixels <<< "$entry"
            suffix=''
            [[ "$pixels" == $((size * 2)) ]] && suffix='@2x'
            sips -z "$pixels" "$pixels" resources/icons/1024x1024/app.png --out "$iconset/icon_${size}x${size}${suffix}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o resources/icons/app.icns
      - name: Build native package
        run: |
          python -u - <<'PY'
          import collections, os, pathlib, subprocess, sys
          output = pathlib.Path('dist')
          output.mkdir(exist_ok=True)
          tail = collections.deque(maxlen=35)
          with (output / 'build.log').open('w', encoding='utf-8') as log:
              command = [sys.executable, 'build.py', '--jobs', '3',
                         '--native-bridge-dir', 'dist/native-runtime']
              if os.name == 'nt' or sys.platform.startswith('linux'):
                  command.append('--onefile')
              process = subprocess.Popen(command,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
                  tail.append(line.rstrip())
              status = process.wait()
          if status:
              message = '\n'.join(line[-700:] for line in tail)[-3500:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Native package build failed::' + message)
          raise SystemExit(status)
          PY
      - name: Check bundled runtime in isolation
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python - <<'PY'
          import os, pathlib, plistlib, signal, subprocess, sys
          root = pathlib.Path.cwd()
          output = root / 'dist'
          if os.name == 'nt' or sys.platform.startswith('linux'):
              executable = output / ('Buggcraft.exe' if os.name == 'nt' else 'Buggcraft')
          else:
              bundle, = output.glob('*.app')
              info = plistlib.loads((bundle / 'Contents/Info.plist').read_bytes())
              executable = bundle / 'Contents/MacOS' / info['CFBundleExecutable']
          env = dict(os.environ)
          for key in ('PYTHONPATH', 'PYTHONHOME', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML2_IMPORT_PATH'):
              env.pop(key, None)
          env['BUGGCRAFT_LOG_DIR'] = str(output)
          env['PATH'] = os.environ['WINDIR'] + '/System32' if os.name == 'nt' else '/usr/bin:/bin'
          command = [str(executable), '--package-check', str(output / 'package-check.json')]
          process = subprocess.Popen(command, cwd=output, env=env)
          try:
              try:
                  status = process.wait(timeout=300)
              except subprocess.TimeoutExpired:
                  # Packaged startup enables faulthandler. Preserve the hung
                  # threads before stopping a POSIX process, rather than only
                  # reporting that the parent reached its deadline.
                  if os.name == 'nt':
                      process.terminate()
                  else:
                      process.send_signal(signal.SIGABRT)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
                  raise
              if status:
                  raise subprocess.CalledProcessError(status, command)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
              for name in ('package-check.json', 'package-check.log',
                           'buggcraft-crash.log', 'buggcraft-stderr.log'):
                  path = output / name
                  if not path.is_file():
                      continue
                  detail = path.read_text(encoding='utf-8', errors='replace')[-10000:]
                  print(name + ':\n' + detail, flush=True)
                  annotation = detail[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Bundled launcher check: ' + name + '::' + annotation, flush=True)
              raise
          PY
      - name: Prepare validated downloads
        run: python scripts/stage_release.py --platform "${{ matrix.platform }}"
      - name: Upload application downloads
        uses: actions/upload-artifact@v4
        with:
          name: Buggcraft-${{ matrix.platform }}-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: dist/release/*
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/signing-status.json
            dist/qt-trim-report.json
            dist/package-check.*
            dist/buggcraft.log
            dist/buggcraft-stderr.log
            dist/buggcraft-crash.log
            dist/build.log
            dist/preflight.log
            dist/client-ui/
            dist/resource-tests.log
            dist/native-build.log
            native-source/build/Testing/Temporary/LastTest.log
      - name: Link downloads in the run summary
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### {os.environ['BUILD_PLATFORM']}\n\n")
              summary.write(f"Download the **Buggcraft-** artifact from [this run]({os.environ['RUN_URL']}).\n\n")
              summary.write('Windows and Linux downloads contain one self-contained executable. macOS downloads contain one ZIP with the native application bundle.\n')
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require successful main build for this exact launcher commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/require_main_build.py
      - name: Test platform synchronization client
        run: python -m unittest discover -s tests -p test_release_platform_sync.py -v
      - uses: actions/download-artifact@v4
        with:
          pattern: Buggcraft-*
          path: release-files
          merge-multiple: true
      - name: Include corresponding source and license
        run: |
          git archive --format=tar.gz -o release-files/Buggcraft-source.tar.gz HEAD
          cp LICENSE release-files/LICENSE
          printf '%s\n' "${GITHUB_REF_NAME#v}" > release-files/BUGGCRAFT_VERSION.txt
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 下载

          - Windows x64：下载并运行 `Buggcraft.exe`。
          - Linux x86_64：下载 `Buggcraft` 并赋予可执行权限后运行；构建目标为 Ubuntu 24.04。
          - Linux ARM64：下载 `Buggcraft-linux-arm64` 并赋予可执行权限后运行；构建目标为 Ubuntu 24.04 ARM64。
          - macOS：按芯片选择 `arm64`（Apple Silicon）或 `x86_64`（Intel），解压后运行应用。
          - `SHA256SUMS-*.txt` 用于核对文件完整性；构建日志留在 Actions，不放入发布下载。

          Windows 构建目前没有受信任的代码签名，macOS 构建使用 ad-hoc 签名且未经 Apple 公证。发布者应先完成对应系统的安装验收与签名审查，再公开此草稿。
          NOTES
          version_notes="docs/releases/版本说明-${RELEASE_TAG#v}.md"
          if [[ -f "$version_notes" ]]; then
            cp "$version_notes" release-notes.md
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release retained; retrying platform synchronization."
          else
            prerelease=()
            [[ "${RELEASE_TAG#v}" == *-* ]] && prerelease=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" --title "Buggcraft $RELEASE_TAG" --notes-file release-notes.md release-files/*
          fi
      - name: Synchronize build assets to platform cache
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/sync_platform_release.py
