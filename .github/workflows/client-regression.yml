name: Client and native regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      BUGGCRAFT_UI_OUTPUT: ${{ github.workspace }}/build/client-regression/ui
      BUGGCRAFT_QML_SNAPSHOTS: ${{ github.workspace }}/build/client-regression/screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vdjango/minecraft-tunnel-native
          ref: f5f0e4433ed8b935c071ab8ae1f8926939b52e83
          path: native-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            native-source/requirements.txt
      - name: Prepare Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev libgl1 libegl1 libxkbcommon0 libxcb-cursor0
      - name: Prepare Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows 'curl[openssl]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt -r native-source/requirements.txt
      - name: Build production C++ node and bridge
        run: |
          mkdir -p build/client-regression
          python scripts/build_bridge.py --native-source native-source --output dist/native-runtime --log build/native-regression-build.log
          ctest --test-dir native-source/build --build-config Release --output-on-failure
          python - <<'PY'
          import os, pathlib, sys
          root = pathlib.Path.cwd()
          package = root / 'dist/native-runtime'
          extension = '.exe' if os.name == 'nt' else ''
          library = package / ('bin/buggcraft_bridge.dll' if os.name == 'nt' else 'lib/libbuggcraft_bridge.so')
          values = dict(
              BUGGCRAFT_NATIVE_SOURCE=root / 'native-source',
              BUGGCRAFT_LAUNCHER_SDK=root / 'src/buggcraft',
              BUGGCRAFT_NATIVE_CORE=package / 'bin' / ('buggcraft-core' + extension),
              BUGGCRAFT_BRIDGE_EXECUTABLE=package / 'bin' / ('buggcraft-bridge' + extension),
              BUGGCRAFT_BRIDGE_LIBRARY=library,
              BUGGCRAFT_BRIDGE_PACKAGE=package,
              PYTHONPATH=root / 'src/buggcraft')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          # Do not add native DLLs to the runner's global PATH. On Windows
          # they can replace Git Bash dependencies before Python even starts.
          # Absolute executable/library paths above select the tested runtime.
          PY
      - name: Test real UI and node diagnostics, consent and ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          # Qt application/scene-graph lifetimes remain local to each module,
          # matching package.yml. Native diagnostics still use the actual node.
          for name in ('test_regression_wiring', 'test_native_cutover', 'test_native_library', 'test_native_routes',
                       'test_native_bridge_runtime', 'test_diagnostics_ui', 'test_room_lobby_ui',
                       'test_room_lobby_live_ui'):
              log = Path('build/client-regression/' + name + '.log')
              try:
                  with log.open('w', encoding='utf-8') as output:
                      result = subprocess.run([sys.executable, '-X', 'faulthandler', '-u', '-m', 'pytest', '-q',
                          '-W', 'error::pytest.PytestUnraisableExceptionWarning',
                          '-o', 'faulthandler_timeout=120', 'tests/' + name + '.py',
                          '--junitxml=build/client-regression/' + name + '.xml'],
                          stdout=output, stderr=subprocess.STDOUT, timeout=300)
              finally:
                  print(log.read_text(encoding='utf-8', errors='replace'), flush=True)
              result.check_returncode()
          PY
      - name: Test real download, import, Java reuse and update behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          # Keep the same pytest cases and assertions, with a fresh Qt/native
          # lifetime per module just as in the UI and packaging steps.
          for name in ('test_download_transport', 'test_download_locks', 'test_download_concurrency',
                       'test_loader_catalogue', 'test_loader_catalogue_regressions', 'test_download_error_presentation',
                       'test_modpack_import', 'test_modpack_missing_mods', 'test_room_mod_installation', 'test_room_launch_flow',
                       'test_java_downloads', 'test_java_runtime_selection', 'test_update_client',
                       'test_launcher_updates'):
              log = Path('build/client-regression/' + name + '.log')
              try:
                  with log.open('w', encoding='utf-8') as output:
                      result = subprocess.run([sys.executable, '-X', 'faulthandler', '-u', '-m', 'pytest', '-v',
                          '-W', 'error::pytest.PytestUnraisableExceptionWarning',
                          '-o', 'faulthandler_timeout=120', 'tests/' + name + '.py',
                          '--junitxml=build/client-regression/' + name + '.xml'],
                          stdout=output, stderr=subprocess.STDOUT, timeout=300)
              finally:
                  print(log.read_text(encoding='utf-8', errors='replace'), flush=True)
              result.check_returncode()
          PY
      - name: Test export controls and responsive worker lifecycle
        run: python -X faulthandler -u -m pytest -q tests/test_instance_modpack_entry.py tests/test_modpack_drop.py tests/test_modpack_no_key.py --junitxml=build/client-regression/export-ui.xml 2>&1 | tee build/client-regression/export-ui.log
      - name: Test duplicate import, editable names and friend entry lifecycle
        run: python -X faulthandler -u -m pytest -q tests/test_download_ui.py tests/test_catalogue_source_regression_ui.py tests/test_modpack_missing_ui.py tests/test_friend_entry_ui.py --junitxml=build/client-regression/download-ui.xml 2>&1 | tee build/client-regression/download-ui.log
      - name: Test real P2P idle, failure, fallback, reconnect and room protocols
        working-directory: native-source
        run: python -u -m unittest tests.test_peer_heartbeat tests.test_peer_reconnect tests.test_peer_signaling_attempt tests.test_peer_stun_fallback tests.test_ipv4_p2p tests.test_route_selection tests.test_relay_handshake tests.test_resource_metadata tests.test_room_lobby tests.test_bridge_services -v 2>&1 | tee ../build/client-regression/native-protocol.log
      - name: Test real native diagnostic upload and flow control
        working-directory: native-source
        run: python -u scripts/check_compatibility.py test_feedback_native 2>&1 | tee ../build/client-regression/native-feedback.log
      - name: Describe failed assertions
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for file in Path('build/client-regression').glob('*.xml'):
              for case in ET.parse(file).iter('testcase'):
                  for tag in ('failure', 'error'):
                      for failure in case.findall(tag):
                          text = ((case.get('classname', '') + '.' + case.get('name', '')) + '\n' + (failure.text or failure.get('message', '')))[-4500:]
                          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error title=Regression assertion::' + text)
          PY
      - name: Retain test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-regression-${{ matrix.os }}
          path: |
            build/client-regression/
            build/native-regression-build.log
            build/room-preparation-ui/
            native-source/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
