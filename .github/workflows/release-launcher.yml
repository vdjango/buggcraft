name: Release launcher build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version without leading v, for example 1.0.1-alpha.1
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: launcher-release-promotion
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test launcher release gates
        run: python -m unittest tests.test_release_gate -v
      - name: Validate the exact requested version and main build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release_launcher_tag.py
