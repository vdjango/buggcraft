name: Release launcher build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version without leading v, for example 1.0.1-alpha.1
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the exact requested version and main build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release_launcher_tag.py
