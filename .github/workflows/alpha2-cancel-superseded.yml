name: Pause pending alpha 2 publication
on:
  push:
    branches: [ci/alpha2-release-promotion]
    paths: [.github/workflows/alpha2-cancel-superseded.yml]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          prefix = 'repos/' + os.environ['GH_REPO']
          run = json.loads(subprocess.check_output(['gh','api',prefix + '/actions/runs/40805276608'],text=True))
          assert run['head_branch'] == 'ci/alpha2-release-promotion'
          assert run['head_sha'] == '98e19fa6a6f00f25fde8cf27a4dcd43d5677426e'
          assert run['path'] == '.github/workflows/alpha2-release-promotion.yml'
          if run['status'] != 'completed':
              subprocess.run(['gh','api','--method','POST',prefix + '/actions/runs/40805276608/cancel'],check=True)
          print('Pending promotion stopped: publication remains paused by user request.')
          PY
