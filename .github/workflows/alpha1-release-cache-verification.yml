name: Verify alpha 1 release cache metadata

on:
  push:
    branches: [ci/alpha1-cache-verification]
    paths: [.github/workflows/alpha1-release-cache-verification.yml]
  workflow_dispatch:

permissions:
  # GitHub requires push-level access to read unpublished release drafts.
  contents: write
  actions: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact built release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          response = subprocess.run(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/releases?per_page=100'],
                                    capture_output=True, text=True)
          if response.returncode:
              print('::error title=Draft metadata unavailable::' + response.stderr[-500:].replace('\n', '%0A'))
              raise SystemExit(response.returncode)
          data = next(row for row in json.loads(response.stdout) if row['tag_name'] == 'v1.0.1-alpha.1')
          assert data['tag_name'] == 'v1.0.1-alpha.1', 'Unexpected tag'
          assert data['draft'] and data['prerelease'], 'Expected the alpha 1 draft prerelease'
          assert len(data['assets']) >= 11, 'Expected all five built platforms'
          Path('alpha1-release.json').write_text(json.dumps(data))
          print(json.dumps({'release_id': data['id'], 'tag': data['tag_name'],
                            'assets': [{'name': a['name'], 'size': a['size'], 'digest': a.get('digest')}
                                       for a in data['assets']]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alpha1-release-metadata
          path: alpha1-release.json
          retention-days: 3
      - name: Retry the failed cache synchronization after verified recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          prefix = 'repos/' + os.environ['GH_REPO']
          def read(path):
              return json.loads(subprocess.check_output(['gh', 'api', prefix + path], text=True))
          run = read('/actions/runs/40780633808')
          assert run['head_sha'] == '3c297672475cdbcbe93b379f09f17840ad0d5b90'
          assert run['head_branch'] == 'v1.0.1-alpha.1'
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          jobs = read('/actions/runs/40780633808/jobs?per_page=100')['jobs']
          packages = [j for j in jobs if j['name'].startswith('package (')]
          assert len(packages) == 5 and all(j['conclusion'] == 'success' for j in packages)
          failed = [j for j in jobs if j['conclusion'] == 'failure']
          assert len(failed) == 1 and failed[0]['name'] == 'release'
          failures = [s['name'] for s in failed[0]['steps'] if s['conclusion'] == 'failure']
          assert failures == ['Synchronize build assets to platform cache']
          subprocess.run(['gh', 'api', '--method', 'POST', prefix + '/actions/runs/40780633808/rerun-failed-jobs'], check=True)
          print('Retried only the failed release synchronization job; all five successful platform packages remain validated.')
          PY
