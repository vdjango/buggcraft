name: Package bridge

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/buggcraft/hookup/**'
      - 'packaging/bridge*'
      - 'requirements-bridge*.txt'
      - 'scripts/build_bridge.py'
      - 'docs/technical/bridge-integration.md'
      - '.github/workflows/bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vdjango/minecraft-tunnel-native
          ref: 2b3babafa8417e3e17a3f9ec87ed4f142caed5c6
          path: native-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Linux compiler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev
      - name: Prepare Windows compiler dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows 'curl[openssl]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Prepare macOS compiler dependencies
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build portable C++ bridge and C ABI
        run: |
          python scripts/build_bridge.py --native-source native-source --output dist/bridge-build
          ctest --test-dir native-source/build --build-config Release --output-on-failure
      - name: Test installed C ABI and multiplayer services
        run: |
          python -m pip install -r native-source/requirements.txt
          python - <<'PY'
          import os, pathlib, subprocess, sys
          package = pathlib.Path('dist/bridge-build').resolve()
          name = 'buggcraft_bridge.dll' if os.name == 'nt' else (
              'libbuggcraft_bridge.dylib' if sys.platform == 'darwin' else 'libbuggcraft_bridge.so')
          library = package / ('bin' if os.name == 'nt' else 'lib') / name
          env = dict(os.environ, BUGGCRAFT_BRIDGE_PACKAGE=str(package),
              BUGGCRAFT_BRIDGE_LIBRARY=str(library),
              BUGGCRAFT_BRIDGE_EXECUTABLE=str(package / 'bin' / ('buggcraft-bridge.exe' if os.name == 'nt' else 'buggcraft-bridge')),
              BUGGCRAFT_NATIVE_CORE=str(package / 'bin' / ('buggcraft-core.exe' if os.name == 'nt' else 'buggcraft-core')))
          env['PATH'] = str(package / 'bin') + os.pathsep + env['PATH']
          subprocess.run([sys.executable, '-X', 'utf8', '-m', 'unittest',
              'tests.test_bridge_library', 'tests.test_player_logs', '-v'],
              cwd='native-source', env=env, check=True)
          PY
      - name: Prepare complete native download
        env:
          BRIDGE_PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil
          output = pathlib.Path('dist/bridge-downloads')
          output.mkdir(parents=True, exist_ok=True)
          staging = output / 'buggcraft-bridge'
          shutil.copytree('dist/bridge-build', staging,
              ignore=shutil.ignore_patterns('buggcraft-core', 'buggcraft-core.exe'))
          archive = pathlib.Path(shutil.make_archive(str(output / ('Buggcraft-bridge-' + os.environ['BRIDGE_PLATFORM'])),
              'zip' if os.name == 'nt' else 'gztar', output, 'buggcraft-bridge'))
          archive.with_suffix('.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n')
          PY
      - name: Upload portable component
        uses: actions/upload-artifact@v4
        with:
          name: Buggcraft-bridge-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/bridge-downloads/*.zip
            dist/bridge-downloads/*.tar.gz
            dist/bridge-downloads/*.sha256
      - name: Upload build analysis on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-diagnostics-${{ matrix.platform }}
          if-no-files-found: ignore
          path: native-source/build/Testing/Temporary/LastTest.log
